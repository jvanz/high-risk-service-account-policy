on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

name: Release policy

jobs:
  test:
    name: run tests and linters
    uses: jvanz/github-actions/.github/workflows/reusable-test-policy-rust.yml@replace-sbom-generator-tool

  release:
    needs: test
    permissions:
      # Required to create GH release
      contents: write
      # Required to push to ghcr.io
      packages: write
      # Required by cosign keyless signing
      id-token: write

    uses: jvanz/github-actions/.github/workflows/reusable-release-policy-rust.yml@replace-sbom-generator-tool
    with:
      oci-target: ghcr.io/kubewarden/policies/high-risk-service-account-policy
